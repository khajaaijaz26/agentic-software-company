name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e . 2>&1
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile check
        run: python -m compileall -q src tests
      - name: Validate JSON schemas parse
        run: |
          python -c "import glob, json; [json.load(open(p, encoding='utf-8')) for p in glob.glob('schemas/*.json')]; [json.load(open(p, encoding='utf-8')) for p in glob.glob('prompts/templates/*.json')]; print('JSON OK')"
      - name: Verify prompt library completeness
        run: |
          python -c "import pathlib; r=list(pathlib.Path('prompts/roles').glob('*.md')); assert len(r)==25, len(r); assert pathlib.Path('prompts/master-orchestrator.md').exists(); print('prompts OK')"