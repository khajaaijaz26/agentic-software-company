name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terminal-platform:
    name: Terminal platform (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Typecheck, lint, test, and build
        run: npm run check

  npm-package:
    name: npm package smoke test
    needs: terminal-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Create package tarball
        run: |
          npm run prepack
          npm pack --ignore-scripts --json > npm-pack.json
          node -e "const fs=require('fs'); const [{filename}]=JSON.parse(fs.readFileSync('npm-pack.json','utf8')); fs.appendFileSync(process.env.GITHUB_ENV, `SOFTWARE_AGENT_TARBALL=${filename}\n`)"
      - name: Test global installation
        run: |
          npm install --global "./${SOFTWARE_AGENT_TARBALL}"
          software-agent --version
          software-agent --json version
          WORKSPACE="$(mktemp -d)/project"
          software-agent --json init "$WORKSPACE" --name "Installed package smoke"
          SOFTWARE_AGENT_CONTROLLER_MODE=embedded software-agent --project "$WORKSPACE" --json run "Inspect this empty project and report readiness" > installed-run.json
          node -e "const fs=require('fs');const result=JSON.parse(fs.readFileSync('installed-run.json','utf8'));if(result.type!=='run.completed'||result.data?.state!=='SUCCEEDED'||result.data?.agents?.length!==3)process.exit(1)"

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONPATH: src
      SOFTWARE_AGENT_REQUIRE_MCP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with MCP extra
        run: python -m pip install -e ".[mcp]"
      - name: Run unit tests (incl. MCP adapter)
        run: python -m unittest discover -s tests -v
      - name: Compile check
        run: python -m compileall -q src tests
      - name: Validate JSON schemas parse
        run: |
          python -c "import glob, json; [json.load(open(p, encoding='utf-8')) for p in glob.glob('schemas/*.json')]; [json.load(open(p, encoding='utf-8')) for p in glob.glob('prompts/templates/*.json')]; print('JSON OK')"
      - name: Verify prompt library completeness
        run: |
          python -c "import pathlib; r=list(pathlib.Path('prompts/roles').glob('*.md')); assert len(r)==25, len(r); assert pathlib.Path('prompts/master-orchestrator.md').exists(); print('prompts OK')"
      - name: Run delivery evaluation
        run: python evals/scenarios/delivery_cli.py

  package:
    name: Build and installed-wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Test installed wheel and packaged resources
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tempfile
          import venv
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl")).resolve()
          root = Path(tempfile.mkdtemp(prefix="software-agent-wheel-smoke-"))
          environment = root / "venv"
          venv.create(environment, with_pip=True)
          python = environment / "bin" / "python"
          pip = environment / "bin" / "pip"
          subprocess.check_call([str(pip), "install", f"software-agent-compat[mcp] @ {wheel.as_uri()}"])
          child_env = os.environ.copy()
          child_env.pop("PYTHONPATH", None)
          code = """
          from software_agent.mcp_server import list_roles
          from software_agent.resources import PROMPTS_ROOT, SCHEMAS_ROOT, WORKFLOWS_ROOT
          assert (PROMPTS_ROOT / 'roles' / 'technical-lead.md').is_file()
          assert (SCHEMAS_ROOT / 'task-envelope.schema.json').is_file()
          assert (WORKFLOWS_ROOT / 'delivery.yaml').is_file()
          assert list_roles()['count'] == 26
          print('installed wheel resources OK')
          """
          subprocess.check_call([str(python), "-c", code], cwd=root, env=child_env)
          PY
