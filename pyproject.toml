[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "software-agent-compat"
version = "1.0.0"
description = "Software Agent Python and MCP compatibility runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "khajaaijaz26", email = "khajaaijaz26@gmail.com" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2.0,<2"]

[project.scripts]
software-agent-reference = "software_agent.__main__:main"
software-agent-mcp = "software_agent.mcp_server:main"
agentic-company = "agentic_company.__main__:main"
agentic-company-mcp = "agentic_company.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/software_agent/prompts" = ["prompts/*.md"]
"share/software_agent/prompts/policies" = ["prompts/policies/*.md"]
"share/software_agent/prompts/roles" = ["prompts/roles/*.md"]
"share/software_agent/prompts/templates" = ["prompts/templates/*.json"]
"share/software_agent/schemas" = ["schemas/*.json"]
"share/software_agent/schemas/vnext" = ["schemas/vnext/*.json"]
"share/software_agent/workflows" = ["workflows/*.yaml"]
